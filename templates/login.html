{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h1>Welcome Back</h1>

        <form action="/login" method="POST">

            <div class="input-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required>

            </div>

            <button type="submit">

                Login

            </button>

        </form>

        <p>

            Don't have an account?

            <a href="/register">

                Register

            </a>

        </p>

    </div>

</div>

{% endblock %}
